<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verzoekjes | DJ Lizenko</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .request-form {
            max-width: 450px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .request-form input,
        .request-form textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(0,255,242,0.25);
            border-radius: 8px;
            color: var(--white);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .request-form input:focus,
        .request-form textarea:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255,20,147,0.15);
        }
        .request-form textarea {
            height: 110px;
            resize: vertical;
        }
        .request-form .btn {
            width: 100%;
            text-align: center;
            margin-top: 8px;
        }
        .form-status {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .form-status.success {
            display: block;
            background: rgba(34, 180, 50, 0.15);
            border: 1px solid rgba(34,180,50,0.3);
            color: #7cff7c;
        }
        .form-status.error {
            display: block;
            background: rgba(220, 40, 40, 0.15);
            border: 1px solid rgba(220,40,40,0.3);
            color: #ff7c7c;
        }
        .recent-requests {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .recent-requests h3 {
            opacity: 0.7;
            font-weight: normal;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .request-entry {
            background: rgba(255,255,255,0.04);
            border-left: 3px solid var(--neon-pink);
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .request-entry .req-by {
            color: var(--neon-blue);
            font-size: 12px;
            font-weight: bold;
        }
        .request-entry .req-time {
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            display: block;
            margin-top: 4px;
        }
        .no-requests {
            opacity: 0.4;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <a href="../../index.html" class="logo">🎧 LZD•BEATS</a>
        <div class="lang">
            <button onclick="setLang('nl')">NL</button>
            <button onclick="setLang('en')">EN</button>
            <button onclick="setLang('fr')">FR</button>
        </div>
    </div>

    <!-- NAV -->
    <header>
        <nav style="margin-top:50px;">
            <a href="../index.html">Home</a>
            <a href="../about.html">Over mij</a>
            <a href="../events.html">Events</a>
            <a href="../gallery.html">Foto's</a>
            <a href="index.html">Verzoekjes</a>
            <a href="../contact.html">Contact</a>
        </nav>
    </header>

    <!-- HERO -->
    <header class="hero">
        <h1 class="glow" data-nl="VERZOEKJES" data-en="SONG REQUESTS" data-fr="DEMANDES DE MORCEAUX"></h1>
        <p data-nl="Stuur je verzoek voor de set" data-en="Send your request for the set" data-fr="Envoyez votre demande pour le set"></p>
    </header>

    <!-- FORM -->
    <section class="card">
        <h2 class="glow" data-nl="JOUW VERZOEK" data-en="YOUR REQUEST" data-fr="VOTRE DEMANDE"></h2>

        <form class="request-form" onsubmit="handleSubmit(event)">
            <input type="text" id="reqName" placeholder="Jouw naam (optioneel)"
                   data-nl-placeholder="Jouw naam (optioneel)"
                   data-en-placeholder="Your name (optional)"
                   data-fr-placeholder="Votre nom (optionnel)">

            <textarea id="reqSong" placeholder="Welk nummer wil je horen?"
                data-nl-placeholder="Welk nummer wil je horen?"
                data-en-placeholder="Which song do you want to hear?"
                data-fr-placeholder="Quelle chanson voulez-vous entendre?"></textarea>

            <button type="submit" class="btn" data-nl="🎶 VERZOEK VOORWIJZEN" data-en="🎶 SUBMIT REQUEST" data-fr="🎶 SOUMETTRE LA DEMANDE"></button>
        </form>

        <div id="formStatus" class="form-status"></div>
    </section>

    <!-- RECENT REQUESTS (localStorage) -->
    <section class="card">
        <h3 class="glow" style="font-size:18px;text-align:center;" data-nl="RECENTE VERZOEKJES" data-en="RECENT REQUESTS" data-fr="DEMANDES RÉCENTES"></h3>
        <div id="requestList">
            <p class="no-requests" data-nl="Nog geen verzoekjes." data-en="No requests yet." data-fr="Aucune demande pour le moment."></p>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© <span id="year"></span> DJ Lizenko — LZD•BEATS</p>
        <p style="opacity:0.4;font-size:12px;margin-top:8px;" data-nl="Verzoekjes worden lokaal opgeslagen in je browser." data-en="Requests are stored locally in your browser." data-fr="Les demandes sont stockées localement dans votre navigateur."></p>
    </footer>

    <script>
        function setLang(lang) {
            document.querySelectorAll("[data-nl]").forEach(el => {
                el.innerText = el.getAttribute("data-" + lang);
            });
            // Update placeholders
            const nameInput = document.getElementById("reqName");
            const songInput = document.getElementById("reqSong");
            nameInput.placeholder = nameInput.getAttribute("data-" + lang + "-placeholder");
            songInput.placeholder = songInput.getAttribute("data-" + lang + "-placeholder");
        }

        // ---- localStorage-based request storage ----
        const STORAGE_KEY = "dj_requests";

        function getRequests() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            } catch (e) {
                return [];
            }
        }

        function saveRequest(name, song) {
            const requests = getRequests();
            requests.push({
                name: name.trim() || "Gast",
                song: song.trim(),
                timestamp: new Date().toISOString()
            });
            // Keep last 30 entries
            if (requests.length > 30) requests.splice(0, requests.length - 30);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
        }

        function renderRequests() {
            const list = document.getElementById("requestList");
            const requests = getRequests();

            if (requests.length === 0) {
                list.innerHTML = '<p class="no-requests">' +
                    (currentLang === "nl" ? "Nog geen verzoekjes." :
                     currentLang === "en" ? "No requests yet." :
                     "Aucune demande pour le moment.") + '</p>';
                return;
            }

            // Show newest 8 first
            const recent = requests.slice(-8).reverse();
            list.innerHTML = recent.map(r => {
                const time = new Date(r.timestamp);
                const timeStr = time.toLocaleString(currentLang === "nl" ? "nl-NL" : currentLang === "en" ? "en-US" : "fr-FR", {
                    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
                });
                return '<div class="request-entry">' +
                    '<span class="req-by">' + escapeHtml(r.name) + '</span>' +
                    '<div>' + escapeHtml(r.song) + '</div>' +
                    '<span class="req-time">' + timeStr + '</span>' +
                    '</div>';
            }).join("");
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const name = document.getElementById("reqName").value.trim();
            const song = document.getElementById("reqSong").value.trim();
            const status = document.getElementById("formStatus");

            if (!song) {
                status.className = "form-status error";
                status.innerHTML = currentLang === "nl" ? "Geef een nummer in." :
                                  currentLang === "en" ? "Enter a song." :
                                  "Entrez une chanson.";
                return;
            }

            saveRequest(name, song);
            status.className = "form-status success";
            status.innerHTML = currentLang === "nl" ? "Verzoek ontvangen! 🎶" :
                               currentLang === "en" ? "Request received! 🎶" :
                               "Demande reçue ! 🎶";

            document.getElementById("reqSong").value = "";
            document.getElementById("reqName").value = "";

            setTimeout(() => { status.style.display = "none"; }, 4000);
            renderRequests();
        }

        let currentLang = "nl";

        document.getElementById("year").textContent = new Date().getFullYear();
        setLang("nl");
        renderRequests();
    </script>

</body>
</html>
