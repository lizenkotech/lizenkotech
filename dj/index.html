<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | DJ Lizenko</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topbar">
        <a href="../index.html" class="logo">🎧 LZD•BEATS</a>
        <div class="lang">
            <button onclick="setLang('nl')">NL</button>
            <button onclick="setLang('en')">EN</button>
            <button onclick="setLang('fr')">FR</button>
        </div>
    </div>

    <nav style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 0;margin-top:50px;">
        <a href="index.html">Home</a>
        <a href="about.html">Over mij</a>
        <a href="events.html">Events</a>
        <a href="gallery.html">Foto's</a>
        <a href="requests/index.html">Verzoekjes</a>
        <a href="contact.html">Contact</a>
    </nav>

    <header class="hero">
        <img src="assets/images/logo.png" alt="LZD Beats Logo" class="hero-logo">
        <p>Events • Clubs • Festivals</p>
        <h1 class="glow" data-nl="DJ LIZENKO 🎶  DJ Daradinio" data-en="DJ LIZENKO" data-fr="DJ LIZENKO"></h1>
        <p data-nl="DJ voor events • clubs • parties" data-en="DJ for events • clubs • parties" data-fr="DJ pour événements • clubs • soirées"></p>
        <a class="btn-dj" href="requests/index.html" data-nl="🎶 NUMMER AANVRAGEN" data-en="🎶 REQUEST A SONG" data-fr="🎶 DEMANDER UN MORCEAU"></a>
    </header>

    <section class="card">
        <h2 class="glow" data-nl="BOEKING" data-en="BOOKING" data-fr="RÉSERVATION"></h2>
    </section>

    <section class="card">
        <h2 class="glow" data-nl="INFO" data-en="INFO" data-fr="INFOS"></h2>
        <p data-nl="🎛️ DJ controller setup" data-en="🎛️ DJ controller setup" data-fr="🎛️ Setup contrôleur DJ"></p>
        <p data-nl="🔊 Werkt op bestaande geluidsinstallatie" data-en="🔊 Works on existing sound system" data-fr="🔊 Fonctionne avec le système son existant"></p>
        <p data-nl="🎶 Requests mogelijk" data-en="🎶 Requests available" data-fr="🎶 Demandes possibles"></p>
        <p style="margin-top:16px;"><a class="btn-dj-secondary" href="requests/index.html" data-nl="→ Verzoekjes doen" data-en="→ Make a request" data-fr="→ Faire une demande"></a></p>
    </section>

    <section class="card">
        <h2 class="glow" data-nl="SCAN QR VOOR REQUESTS" data-en="SCAN QR FOR REQUESTS" data-fr="SCANNE LE QR POUR LES DEMANDES"></h2>
        <p data-nl="Scan om nummers aan te vragen" data-en="Scan to request songs live" data-fr="Scanne pour demander des morceaux en live"></p>
        <p><em style="opacity:0.5;font-size:13px;" data-nl="(QR-code beschikbaar op locatie)" data-en="(QR code available on location)" data-fr="(Code QR disponible sur place)"></em></p>
    </section>

    <footer style="padding:30px 20px;opacity:0.6;font-size:13px;">
        <p>© <span id="year"></span> DJ Lizenko — LZD•BEATS</p>
    </footer>

    <script>
        function setLang(lang) {
            document.querySelectorAll("[data-nl]").forEach(el => {
                el.innerText = el.getAttribute("data-" + lang);
            });
        }
        document.getElementById("year").textContent = new Date().getFullYear();
        setLang("nl");
    </script>

</body>
</html>
